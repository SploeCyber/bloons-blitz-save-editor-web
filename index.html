<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Edit a Bloons Blitz Profile.Save in your browser.">
  <title>Blitz Save Lab</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">Blitz Save Lab</a>
    <span class="privacy">Files stay on your device</span>
  </header>

  <main class="shell">
    <section id="welcomeView" class="welcome" aria-labelledby="welcomeTitle">
      <h1 id="welcomeTitle">Open a Profile.Save</h1>
      <p>Choose a file to edit. Nothing is uploaded.</p>
      <div id="dropzone" class="dropzone">
        <input id="fileInput" type="file" accept=".save,.Save,*/*" hidden>
        <button id="openButton" class="button button-primary" type="button">Choose file</button>
        <span class="hint">or drop it here</span>
      </div>
    </section>

    <section id="editorView" class="editor" hidden>
      <div class="toolbar">
        <div class="file">
          <strong id="fileName">Profile.Save</strong>
          <span id="fileMeta" class="meta"></span>
        </div>
        <div class="actions">
          <button id="verifyButton" class="button" type="button" disabled>Check original</button>
          <button id="resetButton" class="button" type="button" disabled>Discard changes</button>
          <button id="downloadButton" class="button button-primary" type="button" disabled>Save edited file</button>
        </div>
      </div>

      <div class="tabs" role="tablist" aria-label="Editor mode">
        <button class="tab is-active" type="button" role="tab" aria-selected="true" data-mode="normal">Guided edit</button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-mode="raw">Source JSON</button>
        <span id="syncState" class="status" data-tone="neutral" role="status" aria-live="polite"></span>
      </div>

      <div id="normalEditor" class="pane" role="tabpanel" aria-label="Guided edit"></div>

      <div id="rawEditorPanel" class="pane" role="tabpanel" aria-label="Source JSON" hidden>
        <textarea id="rawEditor" class="raw-editor" spellcheck="false" aria-label="Source JSON"></textarea>
        <div id="rawValidation" class="validation" role="status" aria-live="polite"></div>
      </div>

      <details class="details">
        <summary>Container details</summary>
        <pre id="metadataText"></pre>
      </details>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="src/crypto-js.min.js"></script>
  <script src="src/pako.min.js"></script>
  <script src="src/catalog.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
